secrets:
  # postgresql/data
  POSTGRES_PASSWORD:
    file: ./private/POSTGRES_PASSWORD
  POSTGRES_USER:
    file: ./private/POSTGRES_USER
  # TLS certificates
  ca.crt:
    file: ./private/ca.crt
  server.crt:
    file: ./private/server.crt
  server.key:
    file: ./private/server.key

services:
  db:
    restart: unless-stopped
    image: postgres:alpine  # 14-alpine
    shm_size: 256mb
    networks:
      - internal_network
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
    healthcheck:
      test: ['CMD', '/usr/local/bin/pg_healthcheck.sh']
    volumes:
      - ./postgresql:/var/lib/postgresql
      - ./private/pg_healthcheck.sh:/usr/local/bin/pg_healthcheck.sh:ro
    environment:
      #- POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=dont_use_HOST_AUTH
      - POSTGRES_USER_FILE=/run/secrets/POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/POSTGRES_PASSWORD
