name: networking

services:
  networking:
    container_name: networking
    image: marchefter/alpine:networking
    pull_policy: always
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      # sync OpenSSL CA certificates
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    network_mode: "bridge"
    ports:
      - "8080:80"

  iperf3:
    container_name: iperf3
    image: marchefter/alpine:networking
    pull_policy: always
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - DOCKER_COMMAND: "/usr/bin/iperf3 --server"
    volumes:
      # sync OpenSSL CA certificates
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    network_mode: "bridge"
    ports:
      - "5201:5201"
